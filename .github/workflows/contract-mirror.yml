name: Contract mirror

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: contract-mirror-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CASCADES_TOKEN: ${{ secrets.CASCADES_READ_TOKEN }}
    steps:
      - name: Check out SDK
        uses: actions/checkout@v4
        with:
          path: sdk

      - name: Verify public mirrors agree
        working-directory: sdk
        run: python scripts/verify_contract_mirror.py

      - name: Resolve platform git ref
        id: platform_ref
        if: env.CASCADES_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        working-directory: sdk
        run: |
          set -euo pipefail
          f="contracts/UPSTREAM_COMMIT"
          if [ -f "$f" ]; then
            line="$(grep -v '^[[:space:]]*#' "$f" | grep -v '^[[:space:]]*$' | head -n1 | tr -d '[:space:]')"
            if [ -n "$line" ]; then
              echo "ref=$line" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "ref=main" >> "$GITHUB_OUTPUT"

      - name: Private platform parity unavailable
        if: env.CASCADES_TOKEN == ''
        run: echo "::notice::CASCADES_READ_TOKEN is not configured; verified public mirror consistency only."

      - name: Fork PR private parity unavailable
        if: env.CASCADES_TOKEN != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: echo "::notice::Fork PR cannot receive private platform credentials; a maintainer must run upstream parity before merge."

      - name: Check out private Cascades platform
        if: env.CASCADES_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/checkout@v4
        with:
          repository: cascades-work/cascades
          ref: ${{ steps.platform_ref.outputs.ref }}
          path: platform
          token: ${{ env.CASCADES_TOKEN }}

      - name: Verify against private platform source
        if: env.CASCADES_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        working-directory: sdk
        run: python scripts/verify_contract_mirror.py --against ../platform/apis/cascades.openapi.yaml
